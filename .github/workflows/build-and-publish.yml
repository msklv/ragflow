name: build-and-publish

on:
  push:
    branches: [hardening, main]
    tags: ["v*"]
  pull_request:
    branches: [hardening, main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ragflow

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the Go server + CLI with native libs, assemble the RAGFlow image and
  # publish it to GHCR. Replicates upstream release.yml build path.
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cmake >= 4.0 (runner ships 3.x; RAGFlow C++ needs 4.0)
        run: python3 -m pip install "cmake>=4.0"

      - name: Install lld linker (required to static-link Chromium-built pdfium)
        run: |
          sudo apt-get update
          sudo apt-get install -y lld-20
          sudo ln -sf /usr/bin/ld.lld-20 /usr/bin/ld.lld
          ld.lld --version

      - name: Fetch native static libs (office_oxide, pdfium, pdf_oxide, onnxruntime)
        # build.sh --go requires these in ~/ragflow-native-libs. On the
        # self-hosted release runner they're pre-seeded at /opt/ragflow-native-libs;
        # on ubuntu-latest we must fetch them. download_go_deps.py is the canonical
        # fetch path (PEP-723 deps installed explicitly, not via uv run — uv is not
        # guaranteed present and the full download_deps.py pulls HF models/nltk the
        # Docker build ignores).
        run: |
          python3 -m pip install --quiet nltk "huggingface-hub>=0.25" requests
          python3 ragflow_deps/download_go_deps.py

      - name: Build server binary (with native libs / ORT)
        run: |
          ./build.sh --cpp
          ./build.sh --go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Image metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/hardening') || github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Container CVE scan on the pushed image. Uploads SARIF to Code Scanning.
  # ---------------------------------------------------------------------------
  trivy-image:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Resolve pushed tag
        id: tag
        run: |
          # Prefer semver tag when a tag triggered this run, else branch ref.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "image=${{ env.IMAGE_NAME }}:${GITHUB_REF#refs/tags/}"
          else
            echo "image=${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME}"
          fi

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif